# Auto-update when roadmap source data or generator changes

name: On Push Update

on:
  push:
    paths:
      - 'data/*.csv'
      - 'scripts/*.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl

      - name: Generate Excel file
        run: python scripts/generate_roadmap_excel.py

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/Forerunners_Roadmap_and_Indicators_2026-2029.xlsx
          if git diff --cached --quiet; then
            echo "No roadmap changes to commit."
            exit 0
          fi
          git commit -m "Auto-generate roadmap Excel [skip ci]"
          git push
