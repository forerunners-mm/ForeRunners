name: Deploy ForeRunners website to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Bundle LMS dependencies locally
        run: |
          npm install --prefix /tmp/lvc-build --no-package-lock --no-save esbuild@0.25.0 @supabase/supabase-js@2.57.4
          /tmp/lvc-build/node_modules/.bin/esbuild livelihood-learning-center/app.js --bundle --format=esm --target=es2022 --node-path=/tmp/lvc-build/node_modules --outfile=livelihood-learning-center/app.bundle.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website files
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
